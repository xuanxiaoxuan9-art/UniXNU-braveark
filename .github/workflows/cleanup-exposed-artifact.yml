name: cleanup-exposed-stage1-artifact
on:
  push:
    branches:
      - bringup/peridot-boot-logo-stage1
  workflow_dispatch:
permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the earlier plaintext artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactId = 13607072618;
            try {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifactId
              });
              core.info(`Deleted exposed artifact ${artifactId}.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Artifact ${artifactId} is already absent.`);
              } else {
                throw error;
              }
            }
