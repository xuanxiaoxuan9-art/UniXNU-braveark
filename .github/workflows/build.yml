name: build-peridot-kernel
on: workflow_dispatch
jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device repo
        run: |
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
      - name: Build kernel
        working-directory: UniXNU
        run: |
          ./unixnu defconfig peridot_defconfig -D ../UniXNU-braveark
          # 上游 XNU 的 osfmk/vm/vm_user.c 里有一行引用了不存在的变量：(void) indices;
          # Linux 上 disabled-deferred-reclaim.patch 会删掉它，macOS 这条链路补丁没打上就编不过，
          # 于是 vm_user.o 失败、link.filelist 没生成、corecrypto 连锁报 "No XNU symbol names"。
          # 这里在编译前直接把该行删掉（补丁循环的 reverse-check 会识别为已打补丁而跳过）。
          for f in out/feeds/*/osfmk/vm/vm_user.c out/peridot/tree/.cache/xnu-work/osfmk/vm/vm_user.c; do
            if [ -f "$f" ] && grep -q '(void) indices;' "$f"; then
              sed -i '' '/^[[:space:]]*(void) indices;$/d' "$f"
              echo "fixed: $f"
            fi
          done
          ./unixnu build kernel prelink -D ../UniXNU-braveark
      - name: Diagnose
        if: failure()
        working-directory: UniXNU
        run: |
          echo '===== errors in bootstrap log ====='
          L=out/peridot/logs/kernel-bootstrap.log
          grep -n "error:" "$L" 2>/dev/null | head -30 || echo 'no error lines'
          echo '===== tail ====='
          tail -15 "$L" 2>/dev/null || true
          mkdir -p dbg
          for f in kernel-bootstrap.log kernel.log prelink.log archive-01-build-corecrypto-14.log; do
            cp "out/peridot/logs/$f" "dbg/$f" 2>/dev/null || true
          done
          du -sh dbg/* 2>/dev/null || true
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: UniXNU/dbg/
      - name: Collect
        if: success()
        working-directory: UniXNU
        run: |
          mkdir -p artifacts
          find out/peridot \( -name 'kernel.macho' -o -name '*.noctf' \) -type f -exec cp -v {} artifacts/ \;
          ls -l artifacts
      - name: Encrypt
        if: success()
        working-directory: UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'set ARTIFACT_KEY'; exit 1; }
          tar -C artifacts -cf a.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in a.tar -out artifacts/peridot-kernel.tar.enc
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel
          path: UniXNU/artifacts/
