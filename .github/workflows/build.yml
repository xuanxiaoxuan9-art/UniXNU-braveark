name: build-peridot-kernel
on: workflow_dispatch
jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device repo
        run: |
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
      - name: Add missing drivers
        run: |
          # uke 分支只登记了一部分驱动子模块，peridot 的归档链还用到下面这些（都在 UniXNU 组织下）。
          for d in SoftwareAES ShengUfs GopFramebuffer QcomGeniSpi RamBlock VirtioMmioBlock VirtioMmioConsole QcomBaseband; do
            if [ -d "UniXNU/drivers/$d" ] && [ -n "$(ls -A UniXNU/drivers/$d 2>/dev/null)" ]; then
              echo "present: $d"
            else
              rm -rf "UniXNU/drivers/$d"
              git clone -q --depth 1 "https://github.com/UniXNU/$d.git" "UniXNU/drivers/$d" && echo "cloned: $d"
            fi
          done
          # kit 仓库同样不在 uke 的 .gitmodules 里，缺了 prelink 会直接报 emit_prelink.py 不存在。
          for k in XnuPrelink AdrenoFirmware AdrenoPM4 AirNir ArmSmmu4K VerifiedRoot; do
            if [ -d "UniXNU/kits/$k" ] && [ -n "$(ls -A UniXNU/kits/$k 2>/dev/null)" ]; then
              echo "present: kits/$k"
            else
              rm -rf "UniXNU/kits/$k"
              git clone -q --depth 1 "https://github.com/UniXNU/$k.git" "UniXNU/kits/$k" && echo "cloned: kits/$k"
            fi
          done
      - name: Patch Apple source fetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # uke 分支的 prepare-xnu-source.py 用匿名 GitHub API 拉 Apple 头文件，
          # runner 共享 IP 会被限流成 403。这里给它加一个带 token 的 opener。
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('UniXNU/scripts/prepare-xnu-source.py')
          s = p.read_text()
          if 'Authorization' in s:
              print('already patched')
          else:
              helper = 'import urllib.parse\nimport urllib.request\n\n_TOKEN = os.environ.get("GITHUB_TOKEN") or os.environ.get("GH_TOKEN")\n\n\ndef _open(url, timeout=30):\n    req = urllib.request.Request(url, headers={"User-Agent": "unixnu-build"})\n    host = urllib.parse.urlsplit(url).hostname\n    if _TOKEN and host in ("api.github.com", "raw.githubusercontent.com"):\n        req.add_header("Authorization", "Bearer " + _TOKEN)\n    return urllib.request.urlopen(req, timeout=timeout)'
              s = s.replace('urllib.request.urlopen(', '_open(')
              s = s.replace('import urllib.request', helper)
              p.write_text(s)
              print('patched prepare-xnu-source.py')
          PYEOF
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('UniXNU/scripts/build-native-aes-bindings.py')
          s = p.read_text()
          marker = 'args = parser.parse_args()\n'
          extra = ("args = parser.parse_args()\n"
                   "args.objects_dir.mkdir(parents=True, exist_ok=True)\n"
                   "_native = args.objects_dir / 'NativeAES.o'\n"
                   "if not _native.exists():\n"
                   "    _alt = args.objects_dir / 'SoftwareAES.o'\n"
                   "    if _alt.exists():\n"
                   "        _native.write_bytes(_alt.read_bytes())\n"
                   "        print('seeded NativeAES.o from SoftwareAES.o')\n")
          if '_native.write_bytes' in s:
              print('already patched aes bindings')
          elif marker in s:
              p.write_text(s.replace(marker, extra, 1))
              print('patched build-native-aes-bindings.py')
          else:
              print('aes bindings untouched')
          PYEOF
      - name: Build kernel
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把这一步自己的输出也留进日志目录，失败时 Diagnose 会一起上传。
          mkdir -p out/peridot/logs
          exec > >(tee -a out/peridot/logs/step.log) 2>&1
          # 上游 XNU 的 osfmk/vm/vm_user.c 里有一行引用了不存在的变量：(void) indices;
          # macOS 这条链路的补丁没删掉它，clang 直接报 use of undeclared identifier，
          # 于是 vm_user.o 失败、内核 make 中止。源码落到 tree 之后统一改掉。
          repair() {
            fixed=0
            while read -r f; do
              echo "candidate: $f"
              if grep -q 'indices' "$f"; then
                sed -i '' '/void) indices;/d' "$f"
                echo "fixed: $f"
                fixed=1
              fi
            done < <(find out/peridot/tree -name vm_user.c -type f 2>/dev/null)
            echo "repair fixed=$fixed"
            if [ "$fixed" = 1 ]; then
              # 只删掉 vm_user 的目标文件和记录，让 make 重新编这一个；
              # startup.o.json 不能删——它是整条编译记录集的锚点，缺了它
              # compile_commands.json 那一步会直接失败。
              find out/peridot/tree/build \( -name 'vm_user.o' -o -name 'vm_user.o.json' \) | while read -r o; do
                rm -f "$o"; echo "removed: $o"
              done
            fi
          }
          # 第一段：无显示归档的 bootstrap 内核，它的 kernel.macho 会被发布成 prelink 候选
          # （board.toml 的 [kernel.prelink] reference_candidate 就靠这一步产出）。
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-braveark
          for i in 1 2 3; do
            ./unixnu build kernel -D ../UniXNU-braveark && break
            echo "retry $i"
          done || true
          repair
          ./unixnu build kernel -D ../UniXNU-braveark
          # 第二段：带全部设备归档的完整内核，显示归档此时才有候选可用。
          ./unixnu defconfig peridot_defconfig -D ../UniXNU-braveark
          ./unixnu build kernel -D ../UniXNU-braveark
      - name: Diagnose
        if: failure()
        working-directory: UniXNU
        run: |
          echo '===== real errors ====='
          grep -h "error:" out/peridot/logs/*.log 2>/dev/null | head -40 || echo 'no error lines'
          echo '===== undefined symbols ====='
          sed -n '/Undefined symbols/,$p' out/peridot/logs/*.log 2>/dev/null | head -25 || true
          echo '===== tail ====='
          tail -12 out/peridot/logs/kernel.log out/peridot/logs/kernel-bootstrap.log 2>/dev/null || true
          mkdir -p dbg
          cp out/peridot/logs/*.log dbg/ 2>/dev/null || true
          du -sh dbg/* 2>/dev/null || true
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: UniXNU/dbg/
      - name: Collect
        if: success()
        working-directory: UniXNU
        run: |
          mkdir -p artifacts
          find out/peridot \( -name 'kernel.macho' -o -name '*.noctf' \) -type f -exec cp -v {} artifacts/ \;
          ls -l artifacts
      - name: Encrypt
        if: success()
        working-directory: UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'set ARTIFACT_KEY'; exit 1; }
          tar -C artifacts -cf a.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in a.tar -out artifacts/peridot-kernel.tar.enc
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel
          path: UniXNU/artifacts/
