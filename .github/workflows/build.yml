name: build-peridot-kernel
on: workflow_dispatch
jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device repo
        run: |
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
      - name: Build kernel (attempt 1)
        id: build1
        continue-on-error: true
        working-directory: UniXNU
        run: |
          ./unixnu defconfig peridot_defconfig -D ../UniXNU-braveark
          ./unixnu build kernel prelink -D ../UniXNU-braveark
      - name: Repair sources
        if: steps.build1.outcome == 'failure'
        working-directory: UniXNU
        run: |
          # 上游 XNU 的 osfmk/vm/vm_user.c:4506 有一行引用了不存在的变量：(void) indices;
          # 补丁链在 macOS 上没有把它删掉，clang 直接报 use of undeclared identifier，
          # vm_user.o 编不出来 → 内核 make 中止 → link.filelist 缺失 → corecrypto 报
          # "No XNU symbol names"（那只是连锁现象）。
          # 首次编译失败后，源码一定已经落到 tree 里，这里逐个改掉，再让编译原地续编。
          find out/peridot/tree -name vm_user.c -type f 2>/dev/null | while read -r f; do
            if grep -q '(void) indices;' "$f"; then
              sed -i '' '/^[[:space:]]*(void) indices;$/d' "$f"
              echo "fixed: $f"
            fi
          done
          # 删掉 bootstrap 记录，让内核那一趟重新跑（已有 .o 会跳过，只补 vm_user.o）
          rm -f out/peridot/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json
      - name: Build kernel (attempt 2)
        if: steps.build1.outcome == 'failure'
        working-directory: UniXNU
        run: |
          ./unixnu build kernel prelink -D ../UniXNU-braveark
      - name: Diagnose
        if: failure()
        working-directory: UniXNU
        run: |
          echo '===== real errors ====='
          grep -h "error:" out/peridot/logs/*.log 2>/dev/null | grep -v ' "' | head -40 || echo 'no error lines'
          echo '===== tail of bootstrap log ====='
          tail -15 out/peridot/logs/kernel-bootstrap.log 2>/dev/null || true
          echo '===== tail of prelink log ====='
          tail -15 out/peridot/logs/prelink.log 2>/dev/null || true
          mkdir -p dbg
          cp out/peridot/logs/*.log dbg/ 2>/dev/null || true
          du -sh dbg/* 2>/dev/null || true
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: UniXNU/dbg/
      - name: Collect
        if: success()
        working-directory: UniXNU
        run: |
          mkdir -p artifacts
          find out/peridot \( -name 'kernel.macho' -o -name '*.noctf' \) -type f -exec cp -v {} artifacts/ \;
          ls -l artifacts
      - name: Encrypt
        if: success()
        working-directory: UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'set ARTIFACT_KEY'; exit 1; }
          tar -C artifacts -cf a.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in a.tar -out artifacts/peridot-kernel.tar.enc
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel
          path: UniXNU/artifacts/
