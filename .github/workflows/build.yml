name: build-peridot-kernel
on: workflow_dispatch
jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device repo
        run: |
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
      - name: Build kernel
        working-directory: UniXNU
        run: |
          ./unixnu defconfig peridot_defconfig -D ../UniXNU-braveark
          ./unixnu build kernel prelink -D ../UniXNU-braveark
      - name: Diagnose
        if: always()
        working-directory: UniXNU
        run: |
          echo '===== force a real kernel pass ====='
          rm -f out/peridot/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json
          sed -i '' 's/MAKEJOBS=-j/VERBOSE=YES MAKEJOBS=-j/g' out/peridot/tree/scripts/build-xnu-4k-baseline.sh 2>/dev/null || true
          sed -i '' 's/MAKEJOBS=-j/VERBOSE=YES MAKEJOBS=-j/g' ../UniXNU-braveark/scripts/build-xnu-4k-baseline.sh 2>/dev/null || true
          ./unixnu build kernel -D ../UniXNU-braveark > /tmp/rerun.log 2>&1 || true
          L=out/peridot/logs/kernel-bootstrap.log
          echo "===== bootstrap log size: $(wc -l < $L) lines ====="
          mkdir -p dbg
          cp "$L" dbg/kernel-bootstrap.log 2>/dev/null || true
          cp /tmp/rerun.log dbg/rerun.log 2>/dev/null || true
          cp out/peridot/logs/kernel.log dbg/kernel.log 2>/dev/null || true
          du -sh dbg/* 2>/dev/null || true
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: UniXNU/dbg/
      - name: Collect
        if: always()
        run: |
          mkdir -p artifacts
          find out/peridot -name 'kernel.macho' -o -name '*.noctf' | xargs -r -I{} cp -v {} artifacts/ 2>/dev/null || true
          ls -l artifacts
      - name: Encrypt
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'set ARTIFACT_KEY'; exit 1; }
          tar -C artifacts -cf a.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in a.tar -out artifacts/peridot-kernel.tar.enc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel
          path: artifacts/
