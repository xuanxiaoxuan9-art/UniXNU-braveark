name: build-peridot-kernel
on: workflow_dispatch
jobs:
  kernel:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Unpack device repo
        run: |
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
      - name: Trim archives without sources
        run: |
          # 本板 package/ 里没有 PeridotUsbDebug.c / PeridotThermalProbe.c（只有 Muyu 同名版本），
          # 这两个归档跑不到就整链失败；bring-up 阶段先去掉，等出画面再补。
          python3 - <<'PYEOF'
          import tomllib
          from pathlib import Path
          p = Path('UniXNU-braveark/board.toml')
          if not p.is_file():
              raise SystemExit('board.toml not found at ' + str(p.resolve()))
          s = p.read_text()
          drop = ('build-peridot-usb-debug.py', 'build-peridot-thermal.py')
          new = ''.join(l for l in s.splitlines(True) if not any(d in l for d in drop))
          p.write_text(new)
          print('archives kept:', len(tomllib.loads(new)['kernel']['archives']))
          PYEOF
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
      - name: Ensure UniXNU checkout
        run: |
          # checkout 偶尔不会落地（run #15 就是 UniXNU 目录不存在，后面直接报
          # "trying to start process '/bin/bash' ... No such file or directory"）。这里兜底直连克隆。
          if [ ! -f UniXNU/unixnu ]; then
            echo 'uke checkout missing; cloning directly'
            rm -rf UniXNU
            git clone -q --depth 1 --branch uke https://github.com/Allenwdk/UniXNU.git UniXNU
          fi
          echo "pwd=$(pwd)"
          ls UniXNU | head -8
      - name: Add missing drivers and kits
        run: |
          # uke 分支只登记了一部分子模块，peridot 的归档链还用到底下这些（都在 UniXNU 组织下）。
          for d in SoftwareAES ShengUfs GopFramebuffer QcomGeniSpi RamBlock VirtioMmioBlock VirtioMmioConsole QcomBaseband; do
            if [ -d "UniXNU/drivers/$d" ] && [ -n "$(ls -A UniXNU/drivers/$d 2>/dev/null)" ]; then
              echo "present: drivers/$d"
            else
              rm -rf "UniXNU/drivers/$d"
              git clone -q --depth 1 "https://github.com/UniXNU/$d.git" "UniXNU/drivers/$d" && echo "cloned: drivers/$d"
            fi
          done
          for k in XnuPrelink AdrenoFirmware AdrenoPM4 AirNir ArmSmmu4K VerifiedRoot; do
            if [ -d "UniXNU/kits/$k" ] && [ -n "$(ls -A UniXNU/kits/$k 2>/dev/null)" ]; then
              echo "present: kits/$k"
            else
              rm -rf "UniXNU/kits/$k"
              git clone -q --depth 1 "https://github.com/UniXNU/$k.git" "UniXNU/kits/$k" && echo "cloned: kits/$k"
            fi
          done
      - name: Sync missing scripts from main
        run: |
          # uke 分支缺一部分归档脚本（prepare-storage-headers.py、build-libpthread-kernel.py、
          # build-mockfs-fixture.py 等），它们只存在于上游 main 分支。只补 uke 里没有的文件。
          git clone -q --depth 1 --branch main https://github.com/UniXNU/UniXNU.git /tmp/uxmain
          for d in scripts patches/xnu; do
            mkdir -p "UniXNU/$d"
            for f in /tmp/uxmain/$d/*; do
              name=$(basename "$f")
              if [ ! -e "UniXNU/$d/$name" ]; then
                cp -r "$f" "UniXNU/$d/$name"
                echo "copied: $d/$name"
              fi
            done
          done
          echo "sync done"
      - name: Patch build scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1) uke 的 prepare-xnu-source.py 用匿名 GitHub API 拉 Apple 头文件，runner 共享 IP 会被 403 限流。
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('UniXNU/scripts/prepare-xnu-source.py')
          s = p.read_text()
          if 'Authorization' in s:
              print('already patched prepare-xnu-source.py')
          else:
              helper = 'import urllib.parse\nimport urllib.request\n\n_TOKEN = os.environ.get("GITHUB_TOKEN") or os.environ.get("GH_TOKEN")\n\n\ndef _open(url, timeout=30):\n    req = urllib.request.Request(url, headers={"User-Agent": "unixnu-build"})\n    host = urllib.parse.urlsplit(url).hostname\n    if _TOKEN and host in ("api.github.com", "raw.githubusercontent.com"):\n        req.add_header("Authorization", "Bearer " + _TOKEN)\n    return urllib.request.urlopen(req, timeout=timeout)'
              s = s.replace('urllib.request.urlopen(', '_open(')
              s = s.replace('import urllib.request', helper)
              p.write_text(s)
              print('patched prepare-xnu-source.py')
          PYEOF
          # 2) build-arm-driver.py SoftwareAES 产出 SoftwareAES.o，而绑定脚本写死读 NativeAES.o。
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('UniXNU/scripts/build-native-aes-bindings.py')
          if not p.is_file():
              print('no build-native-aes-bindings.py to patch')
              raise SystemExit(0)
          s = p.read_text()
          marker = 'args = parser.parse_args()\n'
          extra = ("args = parser.parse_args()\n"
                   "args.objects_dir.mkdir(parents=True, exist_ok=True)\n"
                   "_native = args.objects_dir / 'NativeAES.o'\n"
                   "if not _native.exists():\n"
                   "    _alt = args.objects_dir / 'SoftwareAES.o'\n"
                   "    if _alt.exists():\n"
                   "        _native.write_bytes(_alt.read_bytes())\n"
                   "        print('seeded NativeAES.o from SoftwareAES.o')\n")
          if '_native.write_bytes' in s:
              print('already patched aes bindings')
          elif marker in s:
              p.write_text(s.replace(marker, extra, 1))
              print('patched build-native-aes-bindings.py')
          else:
              print('aes bindings untouched')
          PYEOF
      - name: Build kernel
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把这一步自己的输出也留进日志目录，失败时 Diagnose 会一起上传。
          mkdir -p out/peridot/logs
          exec > >(tee -a out/peridot/logs/step.log) 2>&1
          # 上游 XNU 的 osfmk/vm/vm_user.c 里有一行引用了不存在的变量：(void) indices;
          # macOS 这条链路的补丁没删掉它，clang 会报 use of undeclared identifier。
          repair() {
            fixed=0
            while read -r f; do
              echo "candidate: $f"
              if grep -q 'indices' "$f"; then
                sed -i '' '/void) indices;/d' "$f"
                echo "fixed: $f"
                fixed=1
              fi
            done < <(find out/peridot/tree -name vm_user.c -type f 2>/dev/null)
            echo "repair fixed=$fixed"
            if [ "$fixed" = 1 ]; then
              # 只删 vm_user 的目标文件，让 make 重编这一个；startup.o.json 是记录集锚点，不能删。
              find out/peridot/tree/build \( -name 'vm_user.o' -o -name 'vm_user.o.json' \) | while read -r o; do
                rm -f "$o"; echo "removed: $o"
              done
            fi
          }
          # 第一段：无设备归档的 bootstrap 内核，它的 kernel.macho 会被发布成 prelink 候选。
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-braveark
          for i in 1 2 3; do
            ./unixnu build kernel -D ../UniXNU-braveark && break
            echo "retry $i"
          done || true
          repair
          ./unixnu build kernel -D ../UniXNU-braveark
          # prelink 已经写好了 kernel.macho 和 kernel.json，但显示归档读的是 build/xnu-prelink 下
          # 的“参考候选”。把这个 plan 按归档期望的名字发布出来，否则 archive 10 直接报 no candidate。
          if [ -f out/peridot/kernel/kernel.json ]; then
            ( cd out/peridot/tree && python3 scripts/publish-prelink-candidate.py --plan ../kernel/kernel.json --tree . ) || echo 'publish-prelink-candidate failed, continuing'
            if [ -f out/peridot/tree/build/xnu-prelink/native-owner-mobile-graphics-candidate.macho ]; then
              mkdir -p out/peridot/tree/build/native-prelink
              for n in native-owner-ufs-cpu-desktop-v9-hid-init-candidate native-owner-ufs-rootauth3-candidate native-owner-renderbox-presentation-candidate; do
                cp out/peridot/tree/build/xnu-prelink/native-owner-mobile-graphics-candidate.macho "out/peridot/tree/build/native-prelink/$n.macho"
                cp out/peridot/tree/build/xnu-prelink/native-owner-mobile-graphics-candidate.json "out/peridot/tree/build/native-prelink/$n.json"
              done
            fi
          else
            echo 'no kernel.json plan; skip candidate publish'
          fi
          ./unixnu defconfig peridot_defconfig -D ../UniXNU-braveark
          ./unixnu build kernel -D ../UniXNU-braveark
      - name: Diagnose
        if: failure()
        working-directory: UniXNU
        run: |
          echo '===== real errors ====='
          grep -h "error:" out/peridot/logs/*.log 2>/dev/null | head -40 || echo 'no error lines'
          echo '===== undefined symbols ====='
          sed -n '/Undefined symbols/,$p' out/peridot/logs/*.log 2>/dev/null | head -25 || true
          echo '===== step log tail ====='
          tail -25 out/peridot/logs/step.log 2>/dev/null || true
          mkdir -p dbg
          cp out/peridot/logs/*.log dbg/ 2>/dev/null || true
          du -sh dbg/* 2>/dev/null || true
      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: UniXNU/dbg/
      - name: Collect
        if: success()
        working-directory: UniXNU
        run: |
          mkdir -p artifacts
          find out/peridot \( -name 'kernel.macho' -o -name '*.noctf' \) -type f -exec cp -v {} artifacts/ \;
          ls -l artifacts
      - name: Encrypt
        if: success()
        working-directory: UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'set ARTIFACT_KEY'; exit 1; }
          tar -C artifacts -cf a.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in a.tar -out artifacts/peridot-kernel.tar.enc
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel
          path: UniXNU/artifacts/
