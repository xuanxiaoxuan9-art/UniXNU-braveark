name: peridot-first-boot
on:
  workflow_dispatch:
  push:
    branches:
      - bringup/peridot-boot-logo-stage1
permissions:
  contents: read
  actions: read
concurrency:
  group: peridot-first-boot-stage1
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout device project
        uses: actions/checkout@v4

      - name: Unpack device sources
        run: |
          set -eu
          unzip -q unixnu-peridot-repo.zip -d unpack
          mv unpack/unixnu-peridot-repo UniXNU-braveark
          test -s UniXNU-braveark/board.toml
          test -s UniXNU-braveark/configs/peridot-nodisplay_defconfig

      - name: Checkout UniXNU builder and modules
        run: |
          set -eu
          git clone -q --depth 1 --branch uke https://github.com/Allenwdk/UniXNU.git UniXNU
          git -C UniXNU submodule update --init --recursive
          git clone -q --depth 1 --branch main https://github.com/UniXNU/UniXNU.git /tmp/uxmain
          for d in scripts patches/xnu; do
            mkdir -p "UniXNU/$d"
            for f in /tmp/uxmain/$d/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              if [ ! -e "UniXNU/$d/$name" ]; then
                cp "$f" "UniXNU/$d/$name"
              fi
            done
          done
          # The builder's board profile uses this prelink emitter, which is separate from NativePrelink.
          if [ ! -f UniXNU/kits/XnuPrelink/emit_prelink.py ]; then
            git clone -q --depth 1 https://github.com/UniXNU/XnuPrelink.git UniXNU/kits/XnuPrelink
          fi
          test -f UniXNU/unixnu
          test -s UniXNU/drivers/ArmCpu/ArmCpu.cpp
          test -s UniXNU/drivers/ArmDTPlatform/ArmDTPlatform.cpp
          test -s UniXNU/kits/XnuPrelink/emit_prelink.py
          test -f UniXNU/kits/XnuPrelink/emit_prelink.py

      - name: Install build tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          export PATH="$LLD_BIN:$LLVM_BIN:$PATH"
          # The entry-probe assembler expects ld.lld beside the LLVM tools.
          if [ ! -x "$LLVM_BIN/ld.lld" ]; then
            ln -s "$LLD_BIN/ld.lld" "$LLVM_BIN/ld.lld"
          fi
          command -v clang
          command -v llvm-objcopy
          command -v llvm-nm
          test -x "$LLVM_BIN/ld.lld"
          "$LLVM_BIN/ld.lld" --version

      - name: Authenticate Apple source fetches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UniXNU/scripts/prepare-xnu-source.py')
          s = p.read_text()
          if 'Authorization' not in s:
              helper = '''import urllib.parse
          import urllib.request

          _TOKEN = os.environ.get("GITHUB_TOKEN") or os.environ.get("GH_TOKEN")

          def _open(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": "unixnu-build"})
              host = urllib.parse.urlsplit(url).hostname
              if _TOKEN and host in ("api.github.com", "raw.githubusercontent.com"):
                  req.add_header("Authorization", "Bearer " + _TOKEN)
              return urllib.request.urlopen(req, timeout=timeout)
          '''
              s = s.replace('urllib.request.urlopen(', '_open(')
              s = s.replace('import urllib.request', helper, 1)
              p.write_text(s)
              print('patched authenticated source fetch')
          else:
              print('source fetch already authenticated')

          # board.toml explicitly marks filesystems=false for this early boot stage.
          # The current payload builder forgot to forward that switch to the ADT tool.
          p = Path('UniXNU/scripts/unixnu/payload.py')
          body = p.read_text()
          marker = "    if seed:\n        command += ['--unique-chip-id', seed]\n"
          addition = marker + "    if adt.get('filesystems') is False:\n        command.append('--no-filesystems')\n"
          if "command.append('--no-filesystems')" not in body:
              if marker not in body:
                  raise SystemExit('payload.py ADT argument insertion point not found')
              body = body.replace(marker, addition, 1)
              p.write_text(body)
              print('forwarded filesystems=false to minimal ADT generator')
          else:
              print('filesystems=false forwarding already present')
          PY

      - name: Build minimal XNU and RAM payload
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p out/peridot/logs
          exec > >(tee -a out/peridot/logs/step.log) 2>&1

          # Pass 1: generic bootstrap only. This creates XNU compile records and the
          # donor-kernel prelink candidate; it is not yet the device-qualified kernel.
          ./unixnu defconfig bootstrap_defconfig -D ../UniXNU-braveark
          for attempt in 1 2 3; do
            if ./unixnu build kernel -D ../UniXNU-braveark; then
              break
            fi
            echo "bootstrap compile retry $attempt"
          done

          # The current upstream XNU source has one stale cast line on this build path.
          # Remove only that line and its object records, then rebuild the bootstrap pass.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('out/peridot/tree')
          changed = False
          for source in root.rglob('vm_user.c'):
              if source.parts[-3:] == ('tests', 'vm', 'vm_user.c'):
                  continue
              lines = source.read_text(errors='replace').splitlines(True)
              kept = [line for line in lines if '(void) indices;' not in line]
              if len(kept) != len(lines):
                  source.write_text(''.join(kept))
                  print('removed stale indices cast from', source)
                  changed = True
          if changed:
              build = root / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837'
              for obj in build.rglob('vm_user.o'):
                  obj.unlink(missing_ok=True)
              for record in build.rglob('vm_user.o.json'):
                  record.unlink(missing_ok=True)
          PY
          ./unixnu build kernel -D ../UniXNU-braveark

          # Pass 2: use only the libraries required to reach the XNU entry point.
          # UFS, GPU, touch, mobile display and legacy display stay disabled.
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          board = Path('../UniXNU-braveark/board.toml')
          lines = board.read_text().splitlines()
          kernel_at = lines.index('[kernel]')
          archive_at = next(i for i in range(kernel_at + 1, len(lines)) if lines[i].strip() == 'archives = [')
          archive_end = next(i for i in range(archive_at + 1, len(lines)) if lines[i].strip() == ']')
          minimal_archives = [
              'archives = [',
              '  "build-corecrypto-14.py",',
              '  "build-corecrypto-14.py --namespace",',
              '  "build-arm-driver.py ArmDTPlatform",',
              '  "build-arm-driver.py ArmCpu",',
              ']',
          ]
          lines[archive_at:archive_end + 1] = minimal_archives

          payload_at = lines.index('[payload]')
          args_at = next(i for i in range(payload_at + 1, len(lines)) if lines[i].strip() == 'kernel_args = [')
          args_end = next(i for i in range(args_at + 1, len(lines)) if lines[i].strip() == ']')
          lines[args_at:args_end + 1] = [
              'kernel_args = [',
              '  "debug=0x14e",',
              '  "-bravearktextconsole",',
              '  "braveark-hold-reboot=1",',
              ']',
          ]
          board.write_text('\n'.join(lines) + '\n')

          cfg = Path('../UniXNU-braveark/configs/peridot-nodisplay_defconfig')
          config = cfg.read_text()
          if 'CONFIG_XNU_BUILD_ARCHIVES=' not in config:
              config += '\nCONFIG_XNU_BUILD_ARCHIVES=y\n'
          cfg.write_text(config)

          parsed = tomllib.loads(board.read_text())
          assert parsed['kernel']['archives'] == [
              'build-corecrypto-14.py',
              'build-corecrypto-14.py --namespace',
              'build-arm-driver.py ArmDTPlatform',
              'build-arm-driver.py ArmCpu',
          ]
          assert 'native-ufs-root=1' not in parsed['payload']['kernel_args']
          print('minimal archive profile validated')
          PY
          ./unixnu defconfig peridot-nodisplay_defconfig -D ../UniXNU-braveark
          ./unixnu build kernel -D ../UniXNU-braveark
          ./unixnu build payload -D ../UniXNU-braveark --unique-chip-id 0x123456789ABCDEF0

      - name: Diagnose build failure
        if: failure()
        run: |
          if [ -d UniXNU ]; then
            grep -h "error:" UniXNU/out/peridot/logs/*.log 2>/dev/null | head -60 || true
            tail -100 UniXNU/out/peridot/logs/step.log 2>/dev/null || true
            mkdir -p UniXNU/dbg
            cp UniXNU/out/peridot/logs/*.log UniXNU/dbg/ 2>/dev/null || true
          fi

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-stage1-debug
          path: UniXNU/dbg/

      - name: Collect minimal boot outputs
        if: success()
        working-directory: UniXNU
        run: |
          set -eu
          mkdir -p artifacts
          test -s out/peridot/kernel/kernel.macho
          test -s out/peridot/payload/payload.img
          cp out/peridot/kernel/kernel.macho artifacts/
          cp out/peridot/payload/payload.img artifacts/
          cp out/peridot/payload/payload.json artifacts/
          cp out/peridot/kernel/kernel.json artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Encrypt test bundle
        if: success()
        working-directory: UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo 'ARTIFACT_KEY secret is required'; exit 1; }
          tar -C artifacts -cf peridot-stage1.tar .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -in peridot-stage1.tar -out artifacts/peridot-stage1.tar.enc

      - name: Upload minimal test bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peridot-stage1-xnu-payload
          path: UniXNU/artifacts/
